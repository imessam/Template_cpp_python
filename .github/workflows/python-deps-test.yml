# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  pull_request:
    branches: [ "main" ]
    
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: python-deps-test

    runs-on: [ runner_python ]

    steps:
    - uses: actions/checkout@v4
      with:
          submodules: recursive

    # - uses: actions/checkout@v4
    #   with:
    #     repository: ORG/REPO
    #     path: test_libs/Module
    #     ref: main

    - name: Install dependencies
      working-directory: ${{github.workspace}}/python
      run: |
        python3 -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # - name: Modify root directory
    #   working-directory: ${{github.workspace}}
    #   run: | 
    #     printf "\nroot_dir: \"%s/libs/AnotherModule\"" $(pwd) >> configs/config_.yaml && cat configs/config_.yaml
        
    - name: Test with pytest
      working-directory: ${{github.workspace}}/python/tests
      run: |
        python3 -m pytest
